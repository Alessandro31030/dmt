<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEARID ME</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DEARID">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060E17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* layout: one-column phone app; a single water drop fills toward the day's goal, everything else is quiet white cards */
  --bg:#F2F5F9; --tint:#DDEBF8; --surface:#FFFFFF; --ink:#0C1A2A; --muted:#66768A; --faint:#A1ADBB; --line:#E4EAF1;
  --water:#1D8FE1; --water-2:#0B5FB0; --aqua:#62D2F6; --water-soft:#E4F1FC; --on-water:#FFFFFF;
  --good:#1E9C69; --warn:#D2840F; --crit:#D64535;
  --shadow:0 1px 2px rgba(12,26,42,.04),0 6px 20px rgba(12,26,42,.06);
  --shadow-lg:0 14px 40px rgba(12,40,70,.16);
  --display:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Plus Jakarta Sans",system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060E17; --tint:#0D2438; --surface:#0F1B29; --ink:#EAF2FA; --muted:#8C9BAD; --faint:#566678; --line:#1C2B3C;
    --water:#3AA6F0; --water-2:#1B74C4; --aqua:#73DBFA; --water-soft:#122A41; --on-water:#FFFFFF; --tp:26%;
    --good:#3CC48A; --warn:#E9A23B; --crit:#F0705E;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 16px 44px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060E17; --tint:#0D2438; --surface:#0F1B29; --ink:#EAF2FA; --muted:#8C9BAD; --faint:#566678; --line:#1C2B3C;
  --water:#3AA6F0; --water-2:#1B74C4; --aqua:#73DBFA; --water-soft:#122A41; --on-water:#FFFFFF; --tp:26%;
  --good:#3CC48A; --warn:#E9A23B; --crit:#F0705E;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 16px 44px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .12s ease,background-color .2s,color .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
#main{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.ic{flex:none;display:block}

/* ---------- today: header + drop ---------- */
.today{background:radial-gradient(150% 72% at 50% 0%,var(--tint) 0%,transparent 72%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px 0 8px}
.ttl{display:flex;align-items:center;min-width:0}
.datebtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;padding:2px 2px}
.datebtn b{font:800 30px/1.05 var(--display);letter-spacing:-.015em}
.datebtn span{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.arw{width:32px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.pills{display:flex;gap:8px;flex:none}
.pill{display:flex;align-items:center;gap:5px;height:40px;padding:0 13px 0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font:800 18px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.pill.wx{font-size:16px}
.pill.wx .ic{color:var(--warn)}
.streak.off{color:var(--muted)}
.streak.late .sd{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.gauge{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 16px 2px}
.dropg{width:min(56vw,216px);height:auto;display:block;overflow:visible;filter:drop-shadow(0 18px 28px rgba(29,143,225,.2))}
.dropg .bgd{fill:var(--water-soft)}
.dropg .rim{fill:none;stroke:var(--surface);stroke-width:3;opacity:.9}
.dropg .w1{animation:wv 5.5s linear infinite}
.dropg .w2{animation:wv 8.5s linear infinite reverse}
@keyframes wv{to{transform:translateX(-100px)}}
.dropg .tn{font:800 48px var(--display);letter-spacing:-.02em}
.dropg .tu{font:800 18px var(--display)}
.dropg .ts{font:700 13px var(--body)}
.dropg .t1{fill:var(--ink)} .dropg .t1.ts{fill:var(--muted)}
.dropg .t2{fill:#fff} .dropg .t2.ts{fill:rgba(255,255,255,.86)}
.dropg .bb{fill:rgba(255,255,255,.6);animation:bub 4.5s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.gstat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;text-align:center}
.gstat p{font-weight:700;font-size:15.5px}
.gstat p span{color:var(--muted);font-weight:600}
.pct{font:800 15px/1 var(--display);padding:7px 11px;border-radius:999px;background:var(--water);color:var(--on-water);font-variant-numeric:tabular-nums}
.pct.done{background:var(--good)}
.goal-link{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:999px}

/* ---------- generic ---------- */
.sec{padding:20px 16px 0;display:flex;flex-direction:column;gap:10px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec>h2,.sh h2{font:800 19px/1.2 var(--display);letter-spacing:-.01em;color:var(--ink)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.link{color:var(--water);font-weight:700;font-size:14px;padding:6px 0}
.ph{padding:calc(18px + env(safe-area-inset-top)) 16px 2px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ph h1{font:800 32px/1.05 var(--display);letter-spacing:-.015em}
.ph p{color:var(--muted);font-size:13px;font-weight:600;text-align:right}
.insight{display:flex;gap:12px;align-items:flex-start}
.insight .ii{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--water-soft);color:var(--water);flex:none}
.insight.good .ii{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good)}
.insight.warn .ii{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.insight h3{font-size:15px;font-weight:700;margin-bottom:2px}
.insight p{color:var(--muted);font-size:14px}
.insight.warn{box-shadow:var(--shadow),inset 3px 0 0 var(--warn)}
.insight.good.sk-msg{box-shadow:var(--shadow),inset 3px 0 0 var(--good)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qb{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 11px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.qb b{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
.qb b small{font:700 12px var(--body);color:var(--muted);margin-left:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px;white-space:nowrap;min-height:44px}
.chip b{font:800 15px/1 var(--display);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--water);color:var(--on-water)}
.chip.txt{padding:8px 16px}
.chip.more{padding:8px 16px 8px 12px;color:var(--water);font-weight:700}
.di{flex:none;display:grid;place-items:center;border-radius:31%;background:color-mix(in srgb,var(--c) var(--tp,14%),var(--surface))}
.di svg{display:block}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;min-width:0}
.mini-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:var(--muted)}
.mini-h .ic{color:var(--water)}
.mini-f{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.mini-f b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.mini-f small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:3px}
.rbs{display:flex;gap:6px;flex:none}
.rb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--water-soft);color:var(--water);flex:none}
.rb.pri{background:var(--water);color:var(--on-water)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-weight:700;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.btn.pri{background:linear-gradient(180deg,var(--water),var(--water-2));color:var(--on-water);box-shadow:0 8px 20px rgba(29,143,225,.3)}
.btn.ghost{box-shadow:none;background:none;color:var(--muted)}
.btn.danger{color:var(--crit)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:14px}
.rowc{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rowc h3{font-size:15px;font-weight:700}
.rowc p{color:var(--muted);font-size:13.5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:0}
.kv dt{font-weight:700;min-width:0}
.kv dt small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.kv dd{margin:0;font:800 19px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv .tot{border-top:1px solid var(--line);padding-top:12px}
.kv dd.tot{font-size:26px;color:var(--water)}
.inl{display:flex;align-items:center;gap:8px;margin-top:6px}
input[type=number],input[type=text],input[type=time],select{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;color:var(--ink)}
input[type=number],input[type=text],input[type=time]{-webkit-appearance:none;appearance:none}
.inl input{width:130px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;flex:1;min-width:0;width:100%;text-align:left}
.li .g1{flex:1;min-width:0}
.li .g1 b{display:block;font-weight:700;overflow-wrap:anywhere}
.li .g1 small{color:var(--muted);font-size:12.5px}
.li .ml{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.li .ml small{display:block;font:500 11.5px/1.5 var(--body);color:var(--muted)}
.del{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--faint);flex:none;margin-right:-6px}
.del:hover,.del:focus-visible{color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent)}
.card.lst{padding:4px 12px 4px 14px}
.list>.li+.li{border-top:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px;padding:14px 0;text-align:center}
.note{color:var(--muted);font-size:12.5px}
.g{display:flex;flex-direction:column;gap:7px}
.g+.g{margin-top:16px}
.g-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.g-h b{font:800 21px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-h b small{font:600 12.5px/1 var(--body);color:var(--muted)}
.g-bar{height:10px;border-radius:999px;background:var(--water-soft);overflow:hidden}
.g-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--aqua),var(--water))}
.g.warn .g-bar i{background:var(--warn)} .g.crit .g-bar i{background:var(--crit)}
.g .tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.g.warn .tag{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)} .g.crit .tag{background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.tile b{display:block;font:800 28px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:6px}
.tile b span{font:600 13px/1 var(--body);color:var(--muted)}
.tile em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:3px}
button.tile{text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:12px;padding:3px}
.seg button{min-height:36px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pernav{display:flex;align-items:center;justify-content:space-between}
.pernav b{font:800 18px/1 var(--display)}
.icb{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:600 10px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--water);opacity:.32}
.chart .bar.hit{fill:url(#cbg);opacity:1}
.chart .sel .bar{opacity:1}
.chart .sel text{fill:var(--ink);font-weight:700}
.chart .goal{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 2;opacity:.35}
.chart .val{font:800 12px var(--display);fill:var(--ink)}
.chart .hitbox{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:600;margin-top:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:3px;background:var(--water);margin-right:5px;vertical-align:middle}
.legend i.l2{opacity:.32} .legend i.l3{height:0;border-top:2px dashed var(--muted);background:none;border-radius:0}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.dist .nm{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.dist .bar{height:8px;border-radius:999px;background:var(--water-soft);overflow:hidden;min-width:50px}
.dist .bar i{display:block;height:100%;border-radius:999px}
.dist .v{font:800 15px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:9px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{border-top:0;color:var(--muted);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left;white-space:normal;font-weight:600}
.tw{overflow-x:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.icpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ipk{display:grid;place-items:center;padding:6px 0;border-radius:12px;border:2px solid transparent;background:var(--bg)}
.ipk[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft)}

/* ---------- sheets, tabs, toast ---------- */
.sheet-wrap{position:absolute;inset:0;background:rgba(6,16,28,.42);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;width:100%;padding:8px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow-lg)}
.sheet::before{content:"";align-self:center;flex:none;width:38px;height:5px;border-radius:3px;background:var(--line)}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{font:800 24px/1.1 var(--display);letter-spacing:-.01em}
.sheet-h .icb{background:var(--surface);box-shadow:var(--shadow);width:36px;height:36px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;min-width:0}
.dcell span{font-weight:700;font-size:13px;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.dcell small{color:var(--muted);font-size:11.5px;margin-top:-3px}
.dcell[aria-pressed="true"]{border-color:var(--water);background:color-mix(in srgb,var(--water) 6%,var(--surface))}
.mlrow{display:flex;align-items:baseline;gap:8px}
.mlrow input{font:800 44px/1 var(--display);width:160px;padding:6px 12px;min-height:0;font-variant-numeric:tabular-nums}
.mlrow span{font:800 22px/1 var(--display);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--water);min-height:32px}
.sum{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.sum small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.tabs{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:2px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:26px;padding:6px;box-shadow:var(--shadow-lg);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:18px;color:var(--faint);font-size:11px;font-weight:700}
.tab[aria-current="page"]{color:var(--water)}
.fab{width:54px;height:54px;margin:-18px 6px 0;border-radius:50%;background:linear-gradient(160deg,var(--aqua),var(--water) 48%,var(--water-2));color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(29,143,225,.42),0 0 0 4px var(--bg)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow-lg);animation:up .22s ease-out}
.toast button{color:var(--aqua);font-weight:800;flex:none;padding:10px 12px;border-radius:10px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 14px;font-size:13.5px}
.demo b{display:block;font-size:14px}
.demo .btn{background:var(--bg);color:var(--ink);box-shadow:none;flex:none}

/* ---------- streak ---------- */
.sk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.sk b{font:800 76px/.9 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.sk small{color:var(--muted);font-weight:700;font-size:13px}
.sk-msg{font-size:14.5px;display:block}
.sk-msg b{display:block;font-size:15px;margin-bottom:2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wk span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.wk .dt{width:38px;height:38px;margin:0 auto;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line)}
.wk .ok{border-color:transparent;background:var(--water-soft)}
.wk .now{border:2px dashed var(--water)}
.wk .miss{background:var(--line);border-color:var(--line)}
.wk .miss::after{content:"";width:12px;height:2px;border-radius:2px;background:var(--muted)}
.wk .fut{opacity:.45}
.wk .today span{color:var(--water)}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ms div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.ms div b{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
.ms div small{font-size:11px;color:var(--muted);font-weight:600}
.ms .lock{opacity:.5}
.party{position:absolute;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 28%,#3BB8F2 0%,#1D8FE1 40%,#0B4F96 100%);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:24px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:330px}
.pc .sd{animation:pop .8s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 14px 28px rgba(0,0,0,.3))}
@keyframes pop{0%{transform:translateY(-60px) scale(.2);opacity:0}100%{transform:none;opacity:1}}
.pn{font:900 110px/.85 var(--display);font-variant-numeric:tabular-nums}
.pn.bump{animation:bump .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{0%{transform:translateY(40%) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.pc h2{font:800 32px/1.05 var(--display);text-wrap:balance}
.pc p{opacity:.92;font-size:15px}
.pc .btn{margin-top:12px;background:#fff;color:#0B4F96;box-shadow:0 10px 24px rgba(0,0,0,.2);min-width:200px}
.bub i{position:absolute;bottom:-24px;border-radius:50%;background:rgba(255,255,255,.3);animation:rise 3.4s ease-in infinite}
@keyframes rise{to{transform:translateY(-115vh);opacity:0}}
.dgh{grid-column:1/-1;font:700 13px/1.2 var(--body);color:var(--muted);margin:8px 2px 0}
.dgh:first-child{margin-top:0}
.lgh{font:700 12.5px/1.2 var(--body);color:var(--muted);padding:12px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.lgh:first-child{padding-top:6px}
.srow{display:flex;flex-direction:column;gap:2px;padding:11px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow b{font-size:14px}
.srow small{color:var(--muted);font-size:13px}
.srow a{color:var(--water);font-weight:700;font-size:13px;text-decoration:none;align-self:flex-start;padding:2px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.dropg .w1,.dropg .w2,.dropg .bb,.sheet,.toast,.pc .sd,.pn.bump,.streak.late .sd{animation:none}.bub{display:none}}
@media (max-width:350px){.datebtn b{font-size:25px}.dgrid{grid-template-columns:repeat(2,1fr)}.qb b{font-size:16px}}
</style>

async function flush(){if(!cloud||flushing)return;flushing=true;
  try{while(dirty.size){const id=dirty.values().next().value;dirty.delete(id);
      const B=st0(),body=id==='meta'?B.meta:B.months[id.slice(2)];if(!body)continue;
      const data=JSON.parse(JSON.stringify(body));

    if(!db||!user){sync='local';paintSync();return}
    const id=await user.id();if(!id){sync='local';paintSync();return}
    const col=db.collection('data/users/'+id);
    const snap=await Promise.race([col.get(),sleep(10000).then(()=>{throw new Error('timeout')})]);
    const seen={};let changed=false;const B=st0();
    snap.docs.forEach(d=>{const raw=d.data();if(!raw)return;const b=JSON.parse(JSON.stringify(raw));seen[d.id]=b.u||0;
      if(d.id==='meta'){if((b.u||0)>(B.meta.u||0)){B.meta=normMeta(b);changed=true}}
      else if(d.id.indexOf('m-')===0){const m=d.id.slice(2),loc=B.months[m];if(!loc||(b.u||0)>(loc.u||0)){B.months[m]=b;changed=true}}});

// Energy: Mifflin-St Jeor (1990) x EFSA physical activity levels (2013)
const PAL=[1.4,1.6,1.8,2.0];
function refs(){const P=S.meta.profile;const bmr=10*P.kg+6.25*P.cm-5*P.age+(P.sex==='f'?-161:5);const pal=PAL[P.act-1]||1.6;const tdee=Math.round(bmr*pal);
  const pl=P.sex==='f'&&(P.cond==='preg'||P.cond==='lact');
  return{tdee,pal,pl,sug:Math.round(tdee*.10/4),caf:pl?200:400,p:Math.round(0.83*P.kg),f:Math.round(tdee*.275/9),cb:Math.round(tdee*.525/4)}}
// Apparent temperature: NOAA/NWS heat index (Rothfusz regression with Steadman fallback)
function heatC(Tc,RH){if(Tc==null)return null;if(RH==null)return Tc;const T=Tc*9/5+32;if(T<40)return Tc;
  const simple=0.5*(T+61+(T-68)*1.2+RH*0.094);let HI=(simple+T)/2;
  if(HI>=80){HI=-42.379+2.04901523*T+10.14333127*RH-.22475541*T*RH-.00683783*T*T-.05481717*RH*RH+.00122874*T*T*RH+.00085282*T*RH*RH-.00000199*T*T*RH*RH;
    if(RH<13&&T>=80&&T<=112)HI-=((13-RH)/4)*Math.sqrt((17-Math.abs(T-95))/17);
    else if(RH>85&&T>=80&&T<=87)HI+=((RH-85)/10)*((87-T)/5)}
  return(HI-32)*5/9}
// Sweat rates, mL/h, 70 kg person, RH 50%: IOM 2005 Appendix C, Table C-1 (USARIEM model). Rest 76 kcal/h, light (walking) 234 kcal/h
const IT=[10,15,20,25,30,35,40],SW_R=[32,65,108,151,201,265,361],SW_L=[100,204,339,473,629,829,1129];
function swI(a,t){t=clamp(t,10,40);const i=Math.min(5,Math.floor((t-10)/5));return a[i]+(a[i+1]-a[i])*(t-IT[i])/5}
const STEP_BASE=7500,STEPS_H=6000,WX_H=12,BEV=0.8;
// EFSA 2010 adequate total water intake (food + drinks); about 80% comes from drinks
function baseAI(){const P=S.meta.profile;let t=P.sex==='f'?2000:2500;if(P.sex==='f'){if(P.cond==='preg')t+=300;else if(P.cond==='lact')t+=700}return t}
function goalParts(k){const D=day(k),P=S.meta.profile,ai=baseAI();
  const base=S.meta.goalMode==='manual'?r10(S.meta.manual):r10(ai*BEV);
  const Ta=D.T!=null?heatC(D.T,D.H):null,te=Ta==null?20:Ta,walkH=Math.max(0,(D.s||0)-STEP_BASE)/STEPS_H;
  const steps=r10(walkH*(swI(SW_L,te)-swI(SW_R,te))*(P.kg/70));
  const wx=Ta==null?0:r10(WX_H*Math.max(0,swI(SW_R,Ta)-swI(SW_R,20)));
  return{base,ai,steps,wx,Ta,walkH,total:base+steps+wx}}
const goal=k=>{const D=day(k);return(k<today()&&D.g)?D.g:goalParts(k).total};
const isWater=d=>d.h>=100&&!d.k&&!d.c&&!d.a;
function dayStats(k){const D=day(k),o={vol:0,eff:0,kcal:0,sug:0,fs:0,caf:0,alc:0,p:0,f:0,cb:0,water:0,by:{},n:D.e.length};
  for(const e of D.e){const d=drink(e.d),q=e.ml/100;o.vol+=e.ml;o.eff+=e.ml*d.h/100;o.kcal+=q*d.k;o.sug+=q*d.s;o.fs+=q*(d.fs!=null?d.fs:d.s);o.caf+=q*d.c;o.alc+=q*d.a*0.789;o.p+=q*d.p;o.f+=q*d.f;o.cb+=q*d.cb;
    if(isWater(d))o.water+=e.ml;o.by[e.d]=(o.by[e.d]||0)+e.ml}
  o.pee=D.p.length;o.steps=D.s||0;o.goal=goal(k);return o}
function records(){const keys=[];
  for(const m in S.months){const ds=S.months[m].days||{};for(const d in ds){const D=ds[d];if(D&&D.e&&D.e.length)keys.push(m+'-'+d)}}
  keys.sort();const r={pb:{v:0,k:null},pbw:{v:0,k:null},tot:0,days:0,longest:0,streak:0,first:keys[0]||null},met={};
  for(const k of keys){const s=dayStats(k);r.days++;r.tot+=s.vol;if(s.eff>r.pb.v)r.pb={v:s.eff,k};if(s.water>r.pbw.v)r.pbw={v:s.water,k};met[k]=s.eff>=s.goal}
  let run=0,prev=null;for(const k of keys){if(met[k]){run=(prev&&addDays(prev,1)===k)?run+1:1;prev=k;if(run>r.longest)r.longest=run}else{run=0;prev=null}}
  let c=today();if(!met[c])c=addDays(c,-1);while(met[c]){r.streak++;c=addDays(c,-1)}
  r.met=met;return r}

function insights(k){const out=[],isT=k===today(),st=dayStats(k),R=records(),D=day(k),gp=goalParts(k),rf=refs(),pct=st.goal?st.eff/st.goal*100:0;

  else if(s>=14)out.push({tone:'good',t:s+' giorni di fila a obiettivo',b:'Utile anche nello sport: perdere in acqua più del 2% del peso corporeo può ridurre la prestazione aerobica (Sawka, ACSM).'});

  if(isT&&gp.wx>0)out.push({t:'Caldo percepito: '+Math.round(gp.Ta)+' °C',b:'Con questa temperatura durante il giorno si suda di più anche stando fermi: l’obiettivo di oggi sale di '+fmt(gp.wx)+' ml.'});

function shStreak(){const si=streakInfo(),t=today(),mon=monday(t),WD=['L','M','M','G','V','S','D'];

  if(si.todayMet){tone='good';msg='<b>Goccia accesa: serie salvata per oggi.</b>Domani raggiungi di nuovo l’obiettivo per arrivare a '+(si.n+1)+(si.n+1===1?' giorno.':' giorni.')}
  else if(si.n>0){tone='warn';msg='<b>La goccia si sta asciugando.</b>Mancano '+fmt(si.need)+' ml all’obiettivo e '+hl(si.left)+' a mezzanotte. Raggiungilo per arrivare a '+(si.n+1)+' giorni, altrimenti la serie torna a 0.'}
  else msg='<b>Accendi la goccia.</b>Raggiungi l’obiettivo di oggi (mancano '+fmt(si.need)+' ml) e la serie parte da 1.';
  let wk='';for(let i=0;i<7;i++){const k=addDays(mon,i),c=k>t?'fut':k===t?(si.todayMet?'ok':'now'):(si.map[k]?'ok':'miss');
    wk+='<div class="'+(k===t?'today':'')+'"><span>'+WD[i]+'</span><div class="dt '+c+'">'+(c==='ok'?dropSvg('on',20):c==='now'?dropSvg(si.n>0?'risk':'off',18):'')+'</div></div>'}
  return'<div class="sheet-h"><h2>La tua serie</h2><button class="icb" data-a="close" aria-label="Chiudi">'+ic('x',18)+'</button></div>'
   +'<div class="sk">'+dropSvg(si.state,96)+'<b>'+si.n+'</b><small>'+(si.n===1?'giorno di fila':'giorni di fila')+'</small></div>'
   +'<div class="card insight '+tone+' sk-msg"><div>'+msg+'</div></div>'
   +'<div class="card"><div class="wk">'+wk+'</div></div>'
   +(next?'<div class="g"><div class="g-h"><span>Prossimo traguardo: '+next+' giorni</span><b>'+(next-si.n)+' <small>'+(next-si.n===1?'giorno mancante':'giorni mancanti')+'</small></b></div><div class="g-bar"><i style="width:'+((si.n-prev)/(next-prev)*100).toFixed(1)+'%"></i></div></div>':'')
   +'<div class="ms">'+MS.map(m=>'<div class="'+(si.longest>=m?'':'lock')+'">'+dropSvg(si.longest>=m?'on':'off',26)+'<b>'+m+'</b><small>giorni</small></div>').join('')+'</div>'
   +'<div class="tiles"><div class="tile"><small>Serie più lunga</small><b>'+si.longest+' <span>'+(si.longest===1?'giorno':'giorni')+'</span></b></div><div class="tile"><small>Giorni a obiettivo</small><b>'+si.total+' <span>in totale</span></b></div></div>'
   +'<p class="note">La serie cresce di 1 per ogni giorno in cui raggiungi l’obiettivo di idratazione, quello che tiene conto di passi e meteo. Hai tempo fino a mezzanotte; se salti un giorno, riparte da 0.</p>'}

async function fetchWx(lat,lon){const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&hourly=temperature_2m,relative_humidity_2m&forecast_days=1&timezone=auto');

  if(!n)throw new Error('empty');return{T:Math.round(t/n),H:Math.round(rh/n)}}
